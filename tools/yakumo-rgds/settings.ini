# Yakumo defaults for the Anbernic RG DS (ROCKNIX). Copied to data/settings.ini
# on the first start; change them in Yakumo's menu (L3+R3) afterwards.

# 4:3 upper screen with no black bars: the game's view takes the screen's
# shape, keeps the PSP's width and shows more above and below (Vert+). The 2D
# interface keeps its proportions. Movies keep 16:9 with bars.
video.aspect=fill
video.vert_plus=1

# 640x480 is drawn at the screen's own lines. If the game is too slow, try
# video.internal_scale=1 (272 lines).
video.internal_scale=auto
# The window is placed by sway over both screens.
video.fullscreen=0
video.present_mode=vsync
video.frame_rate=30
video.fast_loading=1
video.performance=off

# Built-in gamepad; the lower screen holds the on-screen controls.
input.mouse=0
input.touch_controls=1
input.touch_layout=action
